<!-- scan.html -->
{% extends "base.html" %}
{% block title %}Sonique Mini Assembly3 Scan{% endblock %}
{% block body %}
<div class="app-wrap">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo-icon">📦</span>
      <span class="header-title">Sonique Mini Assembly3 Scan</span>
    </div>
    <div class="header-right">
      <span class="operator-badge">👤 {{ operator_en }}</span>
      <select id="sel-shift" class="sel-shift">
        <option value="A">A</option>
        <option value="B">B</option>
      </select>
      <button class="btn-ghost" id="btn-logout">Logout</button>
    </div>
  </header>

  <!-- Tray Counter -->
  <div class="tray-section">
    <div class="tray-counter-wrap">
      <div class="tray-counter-label">Units in Tray</div>
      <div class="tray-counter-display">
        <span id="count-current">0</span>
        <span class="tray-sep">/</span>
        <span class="tray-total">{{ tray_limit }}</span>
      </div>
      <div class="tray-bar-wrap">
        <div id="tray-bar" class="tray-bar" style="width:0%"></div>
      </div>
      <div id="tray-status" class="tray-status-label"></div>
    </div>
    <button class="btn-reset" id="btn-reset">🔄 New Tray</button>
  </div>

  <!-- Chargingboard serial -->
  <div class="scan-section">
    <div class="scan-row">
      <input id="scan-chargingboard" class="scan-input" type="text"
             placeholder="Scan chargingboard serial number…" autocomplete="off" autofocus />
      <button id="btn-scan-chargingboard" class="btn-primary btn-scan">CHECK CHARGINGBOARD</button>
    </div>
    <div id="scan-msg-chargingboard" class="scan-msg hidden"></div>
  </div>

  <!-- LED-board serial -->
  <div class="scan-section">
    <div class="scan-row">
      <input id="scan-ledboard" class="scan-input" type="text"
             placeholder="Scan LED-board serial number…" autocomplete="off" disabled />
      <button id="btn-scan-ledboard" class="btn-primary btn-scan" disabled>VERIFY LED-BOARD</button>
    </div>
    <div id="scan-msg-ledboard" class="scan-msg hidden"></div>
    <!-- Pass / Fail buttons, shown after serial is verified -->
    <div id="decision-row" class="scan-row hidden">
      <button id="btn-pass" class="btn-primary btn-pass">✅ PASS</button>
      <button id="btn-fail" class="btn-primary btn-fail">❌ FAIL</button>
    </div>

    <!-- Fail reason input, shown only when FAIL is clicked -->
    <div id="fail-reason-row" class="scan-row hidden">
      <input id="fail-reason" class="scan-input" type="text"
             placeholder="Enter reason for fail…" autocomplete="off" disabled />
      <button id="btn-submit-fail" class="btn-primary btn-fail">SUBMIT FAIL</button>
      <button id="btn-cancel-fail" class="btn-ghost">Cancel</button>
    </div>
  </div>

  <!-- Log Table -->
  <div class="log-section">
    <div class="log-header">
      <h2>Scan Log</h2>
      <button class="btn-ghost btn-sm" id="btn-clear-log">Clear Log</button>
    </div>
    <div class="table-wrap">
      <table class="log-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Serial Number</th>
            <th>PO Number</th>
            <th>Status</th>
            <th>Message</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="log-body">
          <tr id="empty-row"><td colspan="6" class="empty-log">No scans yet. Start scanning above.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const TRAY_LIMIT = {{ tray_limit }};
  let count = 0;
  let logRows = [];
  let chargingboardSerial = null;
  let verifiedSerial = null;
  let decisionSubmitting = false;

  const countEl   = document.getElementById("count-current");
  const trayBar   = document.getElementById("tray-bar");
  const trayLbl   = document.getElementById("tray-status");

  const scanChargingboard = document.getElementById("scan-chargingboard");
  const scanLedboard = document.getElementById("scan-ledboard");
  const msgChargingboard = document.getElementById("scan-msg-chargingboard");
  const msgLedboard = document.getElementById("scan-msg-ledboard");
  const logBody     = document.getElementById("log-body");
  const emptyRow    = document.getElementById("empty-row");
  const shiftSel    = document.getElementById("sel-shift");
  const btnChargingboard = document.getElementById("btn-scan-chargingboard");
  const btnLedboard = document.getElementById("btn-scan-ledboard");

  const decisionRow   = document.getElementById("decision-row");
  const btnPass        = document.getElementById("btn-pass");
  const btnFail         = document.getElementById("btn-fail");
  const failReasonRow  = document.getElementById("fail-reason-row");
  const failReasonInput = document.getElementById("fail-reason");
  const btnSubmitFail  = document.getElementById("btn-submit-fail");
  const btnCancelFail  = document.getElementById("btn-cancel-fail");

  function updateCounter(n) {
    count = n;
    countEl.textContent = n;
    const pct = Math.min((n / TRAY_LIMIT) * 100, 100);
    trayBar.style.width = pct + "%";
    trayBar.className = "tray-bar" + (n >= TRAY_LIMIT ? " full" : n >= TRAY_LIMIT * 0.8 ? " warn" : "");
    trayLbl.textContent = n >= TRAY_LIMIT ? "✅ Tray Full — Start a New Tray" : "";
    trayLbl.className = "tray-status-label" + (n >= TRAY_LIMIT ? " full" : "");
  }

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = "scan-msg " + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = "scan-msg hidden", 4000);
  }

  function addLogRow(serial, po, status, message) {
    emptyRow.style.display = "none";
    const idx  = logRows.length + 1;
    const time = new Date().toLocaleTimeString();
    const tr   = document.createElement("tr");
    tr.className = "log-row-" + status;
    const addCell = (value, className = "") => {
      const td = document.createElement("td");
      td.className = className;
      td.textContent = value;
      tr.appendChild(td);
      return td;
    };
    addCell(String(idx));
    addCell(serial, "mono");
    addCell(po || "—", "mono");
    const statusCell = addCell("");
    const badge = document.createElement("span");
    badge.className = "badge badge-" + status;
    badge.textContent = status.toUpperCase();
    statusCell.appendChild(badge);
    addCell(message);
    addCell(time);
    logBody.prepend(tr);
    logRows.push(tr);
  }

  function resetScanSteps() {
    chargingboardSerial = null;
    verifiedSerial = null;
    scanChargingboard.value = "";
    scanChargingboard.disabled = false;
    btnChargingboard.disabled = false;
    scanLedboard.value = "";
    scanLedboard.disabled = true;
    btnLedboard.disabled = true;
    decisionRow.classList.add("hidden");
    failReasonRow.classList.add("hidden");
    failReasonInput.disabled = true;
    failReasonInput.value = "";
    scanChargingboard.focus();
  }

  async function checkBoard(scanValue, boardType) {
    const res = await fetch(appUrl("/api/check-board"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ serial_num: scanValue, board_type: boardType })
    });
    return res.json();
  }

  async function doCheckChargingboard() {
    const serial = scanChargingboard.value.trim();
    if (!serial) { showMsg(msgChargingboard, "Scan the chargingboard serial number.", "error"); return; }
    btnChargingboard.disabled = true;
    try {
      const data = await checkBoard(serial, "chargingboard");
      showMsg(msgChargingboard, data.message, data.ok ? "success" : "error");
      if (data.ok) {
        chargingboardSerial = data.serial_num;
        scanChargingboard.disabled = true;
        scanLedboard.disabled = false;
        btnLedboard.disabled = false;
        scanLedboard.focus();
      }
    } catch {
      showMsg(msgChargingboard, "Unable to check the chargingboard serial. Please retry.", "error");
    } finally {
      btnChargingboard.disabled = chargingboardSerial !== null;
    }
  }

  async function doVerifyLedboard() {
    if (count >= TRAY_LIMIT) {
      showMsg(msgLedboard, `Tray is full (${TRAY_LIMIT}/${TRAY_LIMIT}). Click 'New Tray' to reset.`, "error");
      return;
    }
    if (!chargingboardSerial) {
      showMsg(msgLedboard, "Verify the chargingboard serial first.", "error");
      return;
    }
    const serial = scanLedboard.value.trim();
    if (!serial) { showMsg(msgLedboard, "Scan the LED-board serial number.", "error"); return; }
    btnLedboard.disabled = true;
    try {
      const res = await fetch(appUrl("/api/scan"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          serial_num: serial,
          chargingboard: chargingboardSerial,
        })
      });
      const data = await res.json();

      showMsg(msgLedboard, data.message, data.ok ? "success" : "error");
      if (data.ok) {
        verifiedSerial = serial;
        scanLedboard.disabled = true;
        decisionRow.classList.remove("hidden");
      } else {
        scanLedboard.value = "";
        scanLedboard.focus();
      }
    } catch {
      showMsg(msgLedboard, "Unable to verify the LED-board serial. Please retry.", "error");
      scanLedboard.value = "";
      scanLedboard.focus();
    } finally {
      btnLedboard.disabled = verifiedSerial !== null;
    }
  }

  async function submitDecision(decision, remarks = "") {
    if (decisionSubmitting) return;
    decisionSubmitting = true;
    btnPass.disabled = true;
    btnFail.disabled = true;
    btnSubmitFail.disabled = true;
    btnCancelFail.disabled = true;
    failReasonInput.disabled = true;

    try {
      const res  = await fetch(appUrl("/api/scan-decision"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          serial_num: verifiedSerial,
          chargingboard: chargingboardSerial,
          decision,
          shift: shiftSel.value,
          remarks,
        })
      });
      const data = await res.json();

      const statusMap = { ok: "ok", already_assembly: "warn", fail: "fail", not_found: "fail", max_failures: "fail" };
      const uiStatus  = statusMap[data.status] || "fail";

      showMsg(msgLedboard, data.message, data.ok ? "success" : "error");

      if (data.ok) {
        addLogRow(data.serial_num, data.unit?.po_num, uiStatus, data.message);
        if (data.decision === "pass") updateCounter(count + 1);
        resetScanSteps();
      } else {
        // Validation failed on re-check; surface it and keep the decision available.
        addLogRow(verifiedSerial, data.unit?.po_num, uiStatus, data.message);
      }
    } finally {
      decisionSubmitting = false;
      btnPass.disabled = false;
      btnFail.disabled = false;
      btnSubmitFail.disabled = false;
      btnCancelFail.disabled = false;
      failReasonInput.disabled = failReasonRow.classList.contains("hidden");
    }
  }

  btnChargingboard.addEventListener("click", doCheckChargingboard);
  scanChargingboard.addEventListener("keydown", e => { if (e.key === "Enter") doCheckChargingboard(); });

  btnLedboard.addEventListener("click", doVerifyLedboard);
  scanLedboard.addEventListener("keydown", e => { if (e.key === "Enter") doVerifyLedboard(); });

  btnPass.addEventListener("click", () => submitDecision("pass"));

  btnFail.addEventListener("click", () => {
    if (decisionSubmitting) return;
    decisionRow.classList.add("hidden");
    failReasonRow.classList.remove("hidden");
    failReasonInput.disabled = false;
    failReasonInput.focus();
  });

  btnCancelFail.addEventListener("click", () => {
    if (decisionSubmitting) return;
    failReasonRow.classList.add("hidden");
    failReasonInput.disabled = true;
    failReasonInput.value = "";
    decisionRow.classList.remove("hidden");
  });

  btnSubmitFail.addEventListener("click", () => {
    const reason = failReasonInput.value.trim();
    if (!reason) { showMsg(msgLedboard, "Please enter a fail reason.", "error"); return; }
    submitDecision("fail", reason);
  });
  failReasonInput.addEventListener("keydown", e => { if (e.key === "Enter") btnSubmitFail.click(); });

  document.getElementById("btn-reset").addEventListener("click", () => {
    if (!confirm("Start a new tray? The counter will reset to 0.")) return;
    updateCounter(0);
    resetScanSteps();
    showMsg(msgChargingboard, "New tray started.", "success");
  });

  document.getElementById("btn-clear-log").addEventListener("click", () => {
    logRows.forEach(r => r.remove());
    logRows = [];
    emptyRow.style.display = "";
  });

  document.getElementById("btn-logout").addEventListener("click", async () => {
    await fetch(appUrl("/api/logout"), { method: "POST" });
    window.location.href = appUrl("/login");
  });
</script>
{% endblock %}
